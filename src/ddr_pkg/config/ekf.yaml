ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom         

    use_sim_time: true

    # ---------------- odom0: degraded wheel odometry ----------------
    odom0: /odom_noisy
    odom0_config: [false, false, false,   # x,  y,  z
                    false, false, false,   # roll, pitch, yaw
                    true,  false, false,   # vx, vy, vz   <- fuse forward velocity only
                    false, false, true,    # vroll, vpitch, vyaw <- fuse yaw rate
                    false, false, false]   # ax, ay, az
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    odom0_nodelay: true

    # ---------------- imu0: degraded IMU (gyro deterioration model) ----------------
    imu0: /imu_noisy
    imu0_config: [false, false, false,    # x,  y,  z
                    false, false, false,    # roll, pitch, yaw (no absolute yaw ref -> don't fuse orientation)
                    false, false, false,    # vx, vy, vz
                    false, false, true,     # vroll, vpitch, vyaw <- fuse gyro-z (yaw rate)
                    false, false, false]    # ax, ay, az
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_nodelay: true
    imu0_remove_gravitational_acceleration: true

    # ---------------- process noise covariance (tuned for this rig) ----------------
